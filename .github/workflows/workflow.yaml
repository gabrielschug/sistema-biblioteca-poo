name: CI - Integrações Continuas

on: pull request

jobs:
  integracoes-continuas:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Usando Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 22.x
    - name: Instalar, compilar e testar
      run: |
        npm install
        npm run build
        npm run test